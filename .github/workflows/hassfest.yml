name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Hassfest validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This action runs Home Assistant's hassfest container image, which must match the
      # current Home Assistant release, so it follows master. The job only has a
      # read-only token and no checked-out credentials.
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
